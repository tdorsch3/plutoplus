<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>T.R.U.M.P. Tracker</title>
  <meta name="description" content="Local copy of the T.R.U.M.P. Tracker housing dashboard, with live sync and what-if scenarios.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2337322C'/%3E%3Cpath d='M6 17 16 8l10 9v8H6z' fill='%23e2b86b'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Lato:wght@400;700;900&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply the saved theme before first paint.
    try { var t = JSON.parse(localStorage.getItem('tt.theme')); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <div class="brand">
        <h1>T.R.U.M.P. Tracker</h1>
        <p>Unbiased, raw housing data · local copy</p>
      </div>
      <div class="status" id="status" aria-live="polite"></div>
      <div class="actions">
        <button type="button" id="sync-btn" class="btn btn-primary">Sync now</button>
        <button type="button" id="theme-btn" class="btn">Theme: Auto</button>
      </div>
    </div>
    <nav class="wrap tabs" id="tabs" role="tablist" aria-label="Sections"></nav>
  </header>

  <div class="wrap">
    <div class="whatif-banner" id="whatif-banner" hidden>
      <span><b>What-if mode:</b> <span data-count></span>. Scores reflect your values.</span>
      <button type="button" id="reset-btn" class="btn btn-small">Reset to source values</button>
    </div>
  </div>

  <main class="wrap" id="view" tabindex="-1"></main>

  <footer class="wrap foot">
    <p>Data and scoring model: <a href="https://docs.google.com/spreadsheets/d/1VNPGRB5ZcrxxIk_27Mmbe10nxc5wyCuHJPpD4ZGSvEU/edit" target="_blank" rel="noopener noreferrer">T.R.U.M.P. Tracker</a>
      by <a href="https://linktr.ee/zacharyloft" target="_blank" rel="noopener noreferrer">@zacharyloft</a>. This is an unofficial local copy, not affiliated with the author.</p>
  </footer>

  <script src="js/queries.js"></script>
  <script src="js/model.js"></script>
  <script src="js/data.js"></script>
  <script src="js/formulas.js"></script>
  <script src="js/sync.js"></script>
  <script src="data/snapshot.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
